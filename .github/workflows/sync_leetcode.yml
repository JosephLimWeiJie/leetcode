name: Sync Leetcode

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'  # 16:00 UTC is exactly 12:00 AM (midnight) SGT

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sync
        uses: JosephLimWeiJie/leetcode-sync@master
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: solutions
          verbose: true
          commit-header: "[LeetCode Sync]"
